[package]
name = "maxim-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Portable inverted search index for MAXIM reference entries"
license = "MIT"
repository = "https://github.com/giodl73-repo/MAXIM"
include = ["src/**", "Cargo.toml", "Cargo.lock", "docs/search.md", "LICENSE.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.127", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
