name: Library and Rust search
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ''
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust toolchain
        run: rustup show
      - name: Verify and install complete locked Python inputs offline
        run: |
          python tools/test_python_custody.py
          input_sha=$(cut -d' ' -f1 python-inputs/sha256.txt)
          python tools/python_custody.py --sha256 "$input_sha" --output "$RUNNER_TEMP/maxim-python-inputs"
          python -m venv "$RUNNER_TEMP/maxim-python-env"
          "$RUNNER_TEMP/maxim-python-env/bin/python" -m pip install --no-index --no-compile --find-links "$RUNNER_TEMP/maxim-python-inputs/wheels" --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/maxim-python-inputs/requirements-hashes.txt"
          "$RUNNER_TEMP/maxim-python-env/bin/python" -m pip check
          "$RUNNER_TEMP/maxim-python-env/bin/python" tools/build_inputs.py
          echo "$RUNNER_TEMP/maxim-python-env/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/maxim-python-env" >> "$GITHUB_ENV"
      - name: Verify independent Python environment before the build
        run: python tools/check_python_inputs.py --cache "$RUNNER_TEMP/maxim-python-inputs" --venv "$RUNNER_TEMP/maxim-python-env" --snapshot "$RUNNER_TEMP/maxim-python-installed.json" > "$RUNNER_TEMP/maxim-python-input-proof.json"
      - name: Install other build prerequisites
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify and restore complete locked Rust inputs
        run: |
          python tools/test_input_custody.py
          input_sha=$(cut -d' ' -f1 cargo-inputs/sha256.txt)
          python tools/input_custody.py --sha256 "$input_sha" --inputs "$RUNNER_TEMP/maxim-rust-inputs" --cargo-home "$RUNNER_TEMP/maxim-cargo-home"
          echo "CARGO_HOME=$RUNNER_TEMP/maxim-cargo-home" >> "$GITHUB_ENV"
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - name: Verify independent offline Cargo metadata
        run: |
          cargo metadata --locked --offline --all-features --format-version 1 > "$RUNNER_TEMP/maxim-restored-metadata.json"
          python tools/check_input_metadata.py --metadata "$RUNNER_TEMP/maxim-restored-metadata.json" --inputs "$RUNNER_TEMP/maxim-rust-inputs" --cargo-home "$RUNNER_TEMP/maxim-cargo-home" > "$RUNNER_TEMP/maxim-rust-input-proof.json"
      - name: Validate source
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
          python tools/test_build_search.py
          python tools/test_source_custody.py
          python tools/test_site_custody.py
      - name: Package and verify the complete original source archive
        run: |
          source_head=$(git rev-parse HEAD)
          python tools/package-source.py --expected-source-head "$source_head" --output "$RUNNER_TEMP/maxim-source.zip" > "$RUNNER_TEMP/maxim-source-proof.json"
          source_sha=$(python -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/maxim-source-proof.json"))["sha256"])')
          python tools/receive-source.py --source "$RUNNER_TEMP/maxim-source.zip" --sha256 "$source_sha" --commit "$source_head" > "$RUNNER_TEMP/maxim-source-received.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-source
          path: |
            ${{ runner.temp }}/maxim-source.zip
            ${{ runner.temp }}/maxim-source-proof.json
            ${{ runner.temp }}/maxim-source-received.json
      - name: Build library and WASM search
        run: python tools/build-site.py --site site/MAXIM
      - name: Compare original native and WASM search on the complete built index
        run: |
          cargo build --locked --example search-control
          python tools/check-search.py --site site/MAXIM/explore --output "$RUNNER_TEMP/maxim-search-parity"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-parity
          path: |
            ${{ runner.temp }}/maxim-search-parity/build-input.json
            ${{ runner.temp }}/maxim-search-parity/index-fingerprints.json.gz
            ${{ runner.temp }}/maxim-search-parity/stdout
            ${{ runner.temp }}/maxim-search-parity/stderr
            ${{ runner.temp }}/maxim-search-parity/results
      - name: Browser smoke tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/maxim-browser-report.json
        run: npm test -- --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-proof
          path: |
            ${{ runner.temp }}/maxim-browser-report.json
            test-results/
      - name: Rebuild and exercise the complete source archive outside Git
        run: |
          manifest_sha=$(python -c 'import hashlib;from pathlib import Path;print(hashlib.sha256(Path("site/MAXIM/explore/BUILD-MANIFEST.json").read_bytes()).hexdigest())')
          python tools/qualify-archive.py --site site/MAXIM --manifest-sha256 "$manifest_sha" --expected-source-head "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/maxim-archive-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-proof
          path: |
            ${{ runner.temp }}/maxim-archive-proof/receipt.json
            ${{ runner.temp }}/maxim-archive-proof/commands.json
            ${{ runner.temp }}/maxim-archive-proof/site-comparison.json
            ${{ runner.temp }}/maxim-archive-proof/*.stdout
            ${{ runner.temp }}/maxim-archive-proof/*.stderr
            ${{ runner.temp }}/maxim-archive-proof/installed-python.json
            ${{ runner.temp }}/maxim-archive-proof/browser-report.json
            ${{ runner.temp }}/maxim-archive-proof/browser-results/
            ${{ runner.temp }}/maxim-archive-proof/parity/build-input.json
            ${{ runner.temp }}/maxim-archive-proof/parity/index-fingerprints.json.gz
            ${{ runner.temp }}/maxim-archive-proof/parity/stdout
            ${{ runner.temp }}/maxim-archive-proof/parity/stderr
            ${{ runner.temp }}/maxim-archive-proof/parity/results/
      - name: Verify Rust inputs stayed isolated throughout the build
        run: python tools/check_input_metadata.py --metadata "$RUNNER_TEMP/maxim-restored-metadata.json" --inputs "$RUNNER_TEMP/maxim-rust-inputs" --cargo-home "$RUNNER_TEMP/maxim-cargo-home" > "$RUNNER_TEMP/maxim-rust-input-proof-after.json"
      - name: Verify Python inputs stayed unchanged throughout the build
        run: python tools/check_python_inputs.py --cache "$RUNNER_TEMP/maxim-python-inputs" --venv "$RUNNER_TEMP/maxim-python-env" --compare "$RUNNER_TEMP/maxim-python-installed.json" > "$RUNNER_TEMP/maxim-python-input-proof-after.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-input-proof
          path: |
            ${{ runner.temp }}/maxim-python-input-proof.json
            ${{ runner.temp }}/maxim-python-input-proof-after.json
            ${{ runner.temp }}/maxim-python-installed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-input-proof
          path: |
            ${{ runner.temp }}/maxim-rust-input-proof.json
            ${{ runner.temp }}/maxim-rust-input-proof-after.json
            ${{ runner.temp }}/maxim-restored-metadata.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/MAXIM
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
